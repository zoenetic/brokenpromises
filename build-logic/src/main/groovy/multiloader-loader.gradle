plugins {
    id 'multiloader-common'
}

configurations {
    commonJava { canBeResolved = true }
    commonKotlin { canBeResolved = true }
    commonResources { canBeResolved = true }
}

dependencies {
    // Compile-classpath only, so the IDE and compiler can resolve :common.
    // The actual classes come from the source injection below, so each loader
    // jar is self-contained and :common is never shipped as a separate artifact.
    compileOnly(project(':common')) {
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common')
        }
    }
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonKotlin(project(path: ':common', configuration: 'commonKotlin'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

// Filtered to real sources: these configurations resolve to whole directories,
// and an unfiltered tree counts placeholders like .gitkeep as input. That stops
// Gradle marking an empty compile task NO-SOURCE, so javac runs with nothing to
// do and fails with "error: no source files".
tasks.named('compileKotlin') {
    dependsOn(configurations.commonKotlin)
    source(configurations.commonKotlin.asFileTree.matching { include '**/*.kt' })
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava.asFileTree.matching { include '**/*.java' })
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonKotlin, configurations.commonJava, configurations.commonResources)
    from(configurations.commonKotlin, configurations.commonJava, configurations.commonResources)
}
