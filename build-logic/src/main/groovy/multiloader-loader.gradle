plugins {
    id 'multiloader-common'
}

ext.common_project = project("${project.parent.path}:common")

configurations {
    commonJava { canBeResolved = true }
    commonKotlin { canBeResolved = true }
    commonResources { canBeResolved = true }
}

dependencies {
    compileOnly(common_project) {
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common')
        }
    }
    commonJava(project(path: common_project.path, configuration: 'commonJava'))
    commonKotlin(project(path: common_project.path, configuration: 'commonKotlin'))
    commonResources(project(path: common_project.path, configuration: 'commonResources'))
}

tasks.named('compileKotlin') {
    dependsOn(configurations.commonKotlin)
    source(configurations.commonKotlin.asFileTree.matching { include '**/*.kt' })
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava.asFileTree.matching { include '**/*.java' })
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonKotlin, configurations.commonJava, configurations.commonResources)
    from(configurations.commonKotlin, configurations.commonJava, configurations.commonResources)
}
