plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

def modProject = project.parent
['mod_id', 'mod_name', 'mod_description'].each { key ->
    if (modProject == null || !modProject.hasProperty(key)) {
        throw new GradleException(
                "${project.path} applies multiloader-common but its parent project " +
                        "does not define '${key}'. Add it to the mod's gradle.properties.")
    }
    ext[key] = modProject.property(key)
}

description = mod_description

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

kotlin {
    compilerOptions {
        progressiveMode = true
        freeCompilerArgs.addAll('-Xjvm-default=all', '-Xreturn-value-checker=full')
    }
    explicitApi()
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'flk_version'                  : flk_version,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'klf_version'                  : klf_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'mod_namespace'                : mod_namespace,
            'license'                      : license,
            'credits'                      : credits,
            'description'                  : mod_description,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries { key, value ->
        [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) { expand expandProps }
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) { expand jsonExpandProps }

    inputs.properties(expandProps)
}
