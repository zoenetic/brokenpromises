plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id "org.jetbrains.kotlin.kapt"
}

// NeoForm gives us plain vanilla Minecraft with no loader on the classpath.
neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    // Vanilla is only wired into main by default; tests need it too.
    addModdingDependenciesTo(sourceSets.test)
}

dependencies {
    // Both loaders bundle Fabric Mixin and MixinExtras, so they are safe in common.
    // Check what they ship before bumping:
    // https://github.com/neoforged/NeoForge/blob/26.2.x/gradle.properties
    // https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.mockito:mockito-core:5.20.0'
}

// kotlin-test picks its backend from the test task's framework, so this has to
// be set for @Test to resolve to JUnit 5.
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
}

configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonKotlin { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}

// Exported as source directories, not jars - the loader modules compile them in.
artifacts {
    commonJava file('src/main/java')
    commonKotlin file('src/main/kotlin')
    commonResources file('src/main/resources')
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes { attribute(loaderAttribute, 'common') }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes { attribute(loaderAttribute, 'common') }
        }
    }
}
repositories {
    mavenCentral()
}
